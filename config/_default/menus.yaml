# Navigation Links
#   To link a homepage section, specify the URL as `/#` followed by the section's `id`
#   in `content/_index.md`. The weight parameter defines the order of the links.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Papers
    url: /#papers
    weight: 11
  - name: Experience
    url: experience/
    weight: 20
